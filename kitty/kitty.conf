# ========== 外观 ==========
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
font_size        10
adjust_line_height  110%

# 设置背景图片路径（使用绝对路径）
# background_image /home/thin-time/Pictures/背景/20200529212643433-9f59d308-36c4-4c0e-add0-565f993e5787.png

# 图片布局模式：fill（填充）、fit（适应）、stretch（拉伸）、tile（平铺）
# background_image_layout fill

# 透明+模糊（KDE Wayland需开合成器模糊）
background_opacity 0.8
background_blur    30

# 去除滚动条与边框
hide_window_decorations yes
# scrollbar           none
margin_width        10
window_padding_width 15

# hide_on_focus_loss yes     # 失去焦点时自动隐藏

# 窗口设置
initial_window_width  1200
initial_window_height 800
window_padding_width  10

# 光标与颜色
cursor_shape beam
cursor_blink_interval 0.6

# ========== 配色方案 ==========
# 推荐主题：Catppuccin Mocha（可爱风）
# foreground #F5E0DC
# background #1E1E2E
# color0  #45475A
# color1  #F38BA8
# color2  #A6E3A1
# color3  #F9E2AF
# color4  #89B4FA
# color5  #F5C2E7
# color6  #94E2D5
# color7  #BAC2DE
# color8  #585B70
# color9  #F38BA8
# color10 #A6E3A1
# color11 #F9E2AF
# color12 #89B4FA
# color13 #F5C2E7
# color14 #94E2D5
# color15 #A6ADC8

# 状态栏提示符
shell_integration yes

# ========== 启动设置 ==========
confirm_os_window_close 0
allow_remote_control yes
enable_audio_bell no

# 复制粘贴优化
copy_on_select yes
strip_trailing_spaces smart

# 快捷键
# map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window

map ctrl+d launch --location=hsplit
map ctrl+r launch --location=vsplit
# 在分屏窗口间切换
map ctrl+shift+[ previous_window  
map ctrl+shift+] next_window

# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
