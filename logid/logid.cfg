devices: (
    {
        // 设备名称（必须与设备匹配）
        name: "G102 LIGHTSYNC Gaming Mouse";

        // DPI 设置
        dpi: 1200;

        // SmartShift 滚轮模式
        smartshift: {
            on: true;
            threshold: 30;
        };

        // HiRes 滚轮设置
        hiresscroll: {
            hires: true;
            invert: false;
            target: false;
        };

        // 按钮映射
        buttons: (
            {
                // 手势按钮 (cid: 0xc3)
                cid: 0xc3;
                action = {
                    type: "Gestures";
                    gestures: (
                        {
                            direction: "Up";
                            mode: "OnRelease";
                            action = {
                                type: "Keypress";
                                keys: ["KEY_LEFTMETA", "KEY_F"];
                            };
                        },
                        {
                            direction: "Down";
                            mode: "OnRelease";
                            action = {
                                type: "Keypress";
                                keys: ["KEY_LEFTMETA", "KEY_B"];
                            };
                        },
                        {
                            direction: "Left";
                            mode: "OnRelease";
                            action = {
                                type: "Keypress";
                                keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"];
                            };
                        },
                        {
                            direction: "Right";
                            mode: "OnRelease";
                            action = {
                                type: "Keypress";
                                keys: ["KEY_LEFTMETA", "KEY_TAB"];
                            };
                        },
                        {
                            direction: "None";
                            mode: "OnRelease";
                            action = {
                                type: "Keypress";
                                keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_SPACE"];
                            };
                        }
                    );
                };
            }
        );
    }
);
