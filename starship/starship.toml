# version: 1.0.0

# 为 IDE 提供 schema 实现自动补全
"$schema" = 'https://starship.rs/config-schema.json'

# 在提示符之间插入空行
add_newline = true
continuation_prompt = "[▸▹ ](dimmed white)"
command_timeout = 1000

format = '''
[╭─](bold bright-black)[](bold bright-cyan)$directory$git_branch$singularity$kubernetes$vcsh$fossil_branch$hg_branch$pijul_channel$docker_context$helm$pulumi$terraform$vagrant$xmake$memory_usage$aws$gcloud$openstack$azure$custom
[╰─](bold bright-black)$character
'''

right_format = """
$conda
$singularity\
$kubernetes\
$vcsh\
$fossil_branch\
$git_commit\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$helm\
$pulumi\
$terraform\
$vagrant\
$xmake\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$custom\
$cmd_duration
$time"""

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic bright-yellow)"
error_symbol = "[○](italic purple)"
vimcmd_symbol = "[■](italic dimmed green)"
# not supported in zsh
# vimcmd_replace_one_symbol = "◌"
# vimcmd_replace_symbol = "□"
# vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic bright-purple"
symbol = "⋈┈"
disabled = false

[hostname]
ssh_only = false
disabled = false
style = 'bold cyan'
ssh_symbol = "🌐 "

[username]
style_user = "bright-yellow bold italic"
style_root = "purple bold italic"
format = "[⭘ $user]($style) "
disabled = false
show_always = true

[os]
format = "on [($name )]($style)"
style = "bold blue"
disabled = false

[os.symbols]
Arch = "🌀 "

[directory]
home_symbol = "🏠"
truncation_length = 2
# truncation_symbol = " □ "
truncation_symbol = "  "
read_only = " ◈"
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[cmd_duration]
min_time = 500
format = "[tooks $duration ](italic dimmed yellow)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = false

[time]
disabled = false
format = "🕙[$time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed yellow"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[git_branch]
format = "$symbol[$branch(:$remote_branch)]($style)"
symbol = "[](bold italic bold green)"
style = "italic bold green"
truncation_symbol = "⋯"
truncation_length = 11
# ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic bright-blue"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"

# 冲突
conflicted = "[◪◦](italic bright-magenta)"
ahead = "[🡅│[${count}](bold white)│](italic green)"
behind = "[🡇│[${count}](bold white)│](italic red)"
# 分支分叉，同时有 push 和 pull 的差异
diverged = "[⇅ 🡅┤[${ahead_count}](regular white)│🡇┤[${behind_count}](regular white)│](italic bright-magenta)"
untracked = "[◌◦](italic bright-yellow)"
# 存档状态 git stash
stashed = "[📦](italic white)"
# 修改未暂存
modified = "[📝](italic yellow)"
# 暂存区 git add
staged = "[🟩┤[$count](bold white)│](italic bright-cyan)"
renamed = "[⟲](italic bright-blue)"
deleted = "[✕](italic red)"

[git_commit]
style = "italic bright-cyan"
format = "[ 🌿$hash$tag]($style)"
tag_disabled = false
tag_symbol = "🔖"
only_detached = false


[deno]
format = " [deno](italic) [∫ $version](green bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold bright-yellow"

[nodejs]
format = " [node](italic) [◫ ($version)](bold bright-green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[python]
format = " [py](italic) [${symbol}${version}]($style) "
# symbol = "[⌉](bold bright-blue)⌊ "
symbol = "🐍"
version_format = "${raw}"
style = "bold bright-yellow"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold red"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold red"

[package]
disabled = true
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow italic bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = "◁ "
style = "bold bright-red"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " [$symbol$environment]($style) "

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
symbol = "◁◅ "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "🐋 "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
symbol = "◩ "
format = " elm [$symbol($version )]($style)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[haskell]
symbol = "❯λ "
format = " hs [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"

[julia]
symbol = "◎ "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic dimmed blue'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
unknown_msg = '[◌](bold dimmed yellow)'

[spack]
symbol = "◇ "
format = " spack [$symbol$environment]($style)"
